name: Build audio_engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          cd C:/vcpkg
          git pull --quiet
          ./bootstrap-vcpkg.bat -disableMetrics | Out-Null
          ./vcpkg install libsndfile:x64-windows-static fftw3:x64-windows-static rubberband:x64-windows-static --no-print-usage

      - name: Diagnose vcpkg outputs
        shell: pwsh
        run: |
          echo "=== Rubberband includes ==="
          Get-ChildItem "C:/vcpkg/installed/x64-windows-static/include" -Recurse -Filter "*rubber*" | Select-Object FullName
          echo "=== Rubberband libs ==="
          Get-ChildItem "C:/vcpkg/installed/x64-windows-static/lib" -Filter "*rubber*" | Select-Object FullName
          echo "=== Share/cmake for rubberband ==="
          Get-ChildItem "C:/vcpkg/installed/x64-windows-static/share" -Recurse -Filter "*rubber*" | Select-Object FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build audio_engine `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            --debug-find 2>&1 | Select-String -Pattern "rubberband|sndfile|error|Error" | Select-Object -First 40

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_engine-windows-x64
          path: build/Release/audio_engine.exe
          retention-days: 30
