name: Build audio_engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x64-windows-static-rubberband-sndfile

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          cd C:/vcpkg
          git pull
          ./bootstrap-vcpkg.bat
          ./vcpkg integrate install
          ./vcpkg install libsndfile:x64-windows-static
          ./vcpkg install rubberband:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build audio_engine `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_engine-windows-x64
          path: build/Release/audio_engine.exe
          retention-days: 30
