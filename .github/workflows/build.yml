name: Build audio_engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install libsndfile via vcpkg
        shell: pwsh
        run: |
          cd C:/vcpkg
          git pull --quiet
          ./bootstrap-vcpkg.bat -disableMetrics | Out-Null
          ./vcpkg install libsndfile:x64-windows-static --no-print-usage

      - name: Download Rubber Band Windows SDK
        shell: pwsh
        run: |
          # Official prebuilt Windows SDK from breakfastquay
          $url = "https://breakfastquay.com/files/releases/rubberband-3.3.0-gpl-executable-windows.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile rb.zip -ErrorAction Stop
            Expand-Archive rb.zip -DestinationPath rb_sdk
          } catch {
            # Fallback: build minimal version using vcpkg with fftw
            Write-Host "Prebuilt not available, installing via vcpkg with fftw..."
            cd C:/vcpkg
            ./vcpkg install fftw3:x64-windows-static
            ./vcpkg install rubberband:x64-windows-static --no-print-usage
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build audio_engine `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_engine-windows-x64
          path: build/Release/audio_engine.exe
          retention-days: 30
